<title>Parser Dashboard</title>
<style>
  :root {
    --bg: #0b0d12; --surface: #12151c; --surface-2: #181c25; --border: #262b36;
    --text: #e6e9ef; --text-dim: #9199a8; --text-faint: #5b6272;
    --accent: #5b8cff; --green: #34d399; --amber: #fbbf24; --red: #f87171;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
  }
  header {
    padding: 20px 28px; border-bottom: 1px solid var(--border);
    display: flex; align-items: baseline; justify-content: space-between;
  }
  header h1 { font-size: 17px; margin: 0; font-weight: 600; }
  header a.brand { color: inherit; text-decoration: none; }
  header .sub { color: var(--text-faint); font-size: 12px; margin-top: 2px; }
  header .status { font-size: 12px; color: var(--text-dim); }
  header .right { display: flex; align-items: center; gap: 14px; }
  header a.logout { color: var(--text-faint); font-size: 12px; text-decoration: none; }
  header a.logout:hover { color: var(--text); }
  main { padding: 24px 28px; max-width: 1300px; margin: 0 auto; }

  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 12px; margin-bottom: 28px; }
  .stat { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; }
  .stat .label { font-size: 11px; color: var(--text-faint); text-transform: uppercase; letter-spacing: .04em; }
  .stat .value { font-size: 22px; font-weight: 600; margin-top: 4px; }
  .stat.ok .value { color: var(--green); }
  .stat.warn .value { color: var(--amber); }
  .stat.bad .value { color: var(--red); }

  table { width: 100%; border-collapse: collapse; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
  thead th {
    text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .04em;
    color: var(--text-faint); padding: 10px 14px; border-bottom: 1px solid var(--border); background: var(--surface-2);
  }
  tbody td { padding: 10px 14px; border-bottom: 1px solid var(--border); font-size: 13px; }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr { cursor: pointer; }
  tbody tr:hover { background: var(--surface-2); }
  .fname { max-width: 320px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 600; }
  .badge.success { background: rgba(52,211,153,.12); color: var(--green); }
  .badge.empty { background: rgba(251,191,36,.12); color: var(--amber); }
  .badge.failed { background: rgba(248,113,113,.12); color: var(--red); }
  .muted { color: var(--text-faint); }
  .empty-state { text-align: center; padding: 48px 0; color: var(--text-faint); }

  .filters { display: flex; gap: 8px; margin-bottom: 12px; }
  .filters button {
    background: var(--surface); border: 1px solid var(--border); color: var(--text-dim);
    padding: 6px 12px; border-radius: 8px; font-size: 12px; cursor: pointer;
  }
  .filters button.active { background: var(--accent); border-color: var(--accent); color: #fff; }

  a.back { color: var(--text-dim); text-decoration: none; font-size: 12.5px; display: inline-block; margin-bottom: 16px; }
  a.back:hover { color: var(--text); }

  .detail-head h2 { margin: 0 0 4px; font-size: 19px; word-break: break-word; }
  .meta-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 10px; margin: 16px 0; }
  .meta-grid div { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; }
  .meta-grid .k { font-size: 10px; color: var(--text-faint); text-transform: uppercase; }
  .meta-grid .v { font-size: 14px; margin-top: 2px; }
  .error-box { background: rgba(248,113,113,.08); border: 1px solid rgba(248,113,113,.3); color: var(--red); border-radius: 8px; padding: 10px 12px; margin: 12px 0; font-size: 13px; white-space: pre-wrap; }
  pre {
    background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
    padding: 14px; font-size: 12.5px; line-height: 1.6; white-space: pre-wrap; word-break: break-word;
    max-height: 60vh; overflow-y: auto; margin-top: 12px;
  }
  .section-label { font-size: 11px; color: var(--text-faint); text-transform: uppercase; letter-spacing: .04em; margin-top: 28px; }

  .page-compare { display: flex; flex-direction: column; gap: 16px; margin-top: 12px; }
  .page-card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
  .page-card .page-head {
    display: flex; justify-content: space-between; align-items: center;
    padding: 9px 16px; border-bottom: 1px solid var(--border); font-size: 12.5px; color: var(--text-dim); background: var(--surface-2);
  }
  .page-card .page-head b { color: var(--text); font-weight: 600; }
  .page-card .page-body { display: grid; grid-template-columns: 1fr 1fr; gap: 0; }
  @media (max-width: 820px) { .page-card .page-body { grid-template-columns: 1fr; } }
  .page-card .page-img { padding: 12px; display: flex; align-items: flex-start; justify-content: center; border-right: 1px solid var(--border); background: #05060a; }
  .page-card .page-img img { max-width: 100%; border-radius: 6px; display: block; cursor: zoom-in; }
  .page-card .page-img .no-img { color: var(--text-faint); font-size: 12px; padding: 30px 0; }
  .page-card .page-md { padding: 14px 16px; max-height: 480px; overflow-y: auto; }
  .loading-inline { color: var(--text-faint); font-size: 12.5px; padding: 8px 0; }

  /* Rendered markdown — used both in per-page cards and the full-document view */
  .md-render { font-size: 13px; line-height: 1.65; word-break: break-word; }
  .md-render h1, .md-render h2, .md-render h3, .md-render h4 { margin: 14px 0 6px; line-height: 1.3; }
  .md-render h1 { font-size: 17px; } .md-render h2 { font-size: 15.5px; }
  .md-render h3, .md-render h4 { font-size: 14px; color: var(--text-dim); }
  .md-render p { margin: 8px 0; }
  .md-render ul, .md-render ol { margin: 8px 0; padding-left: 22px; }
  .md-render li { margin: 3px 0; }
  .md-render code { background: var(--bg); border: 1px solid var(--border); border-radius: 4px; padding: 1px 5px; font-size: 12px; }
  .md-render a { color: var(--accent); text-decoration: none; }
  .md-render a:hover { text-decoration: underline; }
  .md-render .md-comment { color: var(--text-faint); font-size: 11px; font-style: italic; }
  .md-render .md-fig {
    display: inline-flex; flex-direction: column; gap: 4px; margin: 8px 10px 8px 0;
    padding: 6px; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; vertical-align: top;
  }
  .md-render .md-fig img { max-width: 200px; max-height: 200px; border-radius: 5px; cursor: zoom-in; display: block; }
  .md-render .md-fig .md-fig-caption { font-size: 10.5px; color: var(--text-faint); max-width: 200px; }
  .md-render table { border-collapse: collapse; margin: 10px 0; font-size: 12px; }
  .md-render th, .md-render td { border: 1px solid var(--border); padding: 5px 9px; text-align: left; }
  .md-render th { background: var(--bg); color: var(--text-dim); font-weight: 600; }

  .lightbox { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.85); z-index: 20; align-items: center; justify-content: center; cursor: zoom-out; }
  .lightbox.open { display: flex; }
  .lightbox img { max-width: 92vw; max-height: 92vh; border-radius: 6px; }
</style>

<header>
  <div>
    <a class="brand" href="/dashboard"><h1>PDF Parser — Dashboard</h1></a>
    <div class="sub">Custom layout parser (DocLayout-YOLO + VLM) run history</div>
  </div>
  <div class="right">
    <div class="status" id="last-updated"></div>
    <a class="logout" href="/dashboard/logout">Log out</a>
  </div>
</header>

<main>
  <div id="list-view">
    <div class="stats" id="stats"></div>

    <div class="filters" id="filters">
      <button data-status="" class="active">All</button>
      <button data-status="success">Success</button>
      <button data-status="empty">Empty</button>
      <button data-status="failed">Failed</button>
    </div>

    <table>
      <thead>
        <tr>
          <th>File</th><th>Status</th><th>Mode</th><th>Pages</th><th>Blocks</th><th>Figures</th><th>Duration</th><th>When</th>
        </tr>
      </thead>
      <tbody id="runs-body"></tbody>
    </table>
    <div id="empty-state" class="empty-state" style="display:none">No runs yet.</div>
  </div>

  <div id="detail-view" style="display:none"></div>
</main>

<div class="lightbox" id="lightbox"><img id="lightbox-img" src=""></div>

<script>
  let currentStatus = "";
  const fmtMs = (ms) => ms == null ? "—" : ms < 1000 ? ms + "ms" : (ms / 1000).toFixed(1) + "s";
  const fmtTime = (iso) => { try { return new Date(iso).toLocaleString(); } catch { return iso || "—"; } };
  const esc = (s) => (s ?? "").toString().replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

  async function api(path) {
    const res = await fetch(path, { credentials: "same-origin" });
    if (res.status === 401) {
      window.location.href = "/dashboard/login";
      throw new Error("session expired");
    }
    if (!res.ok) throw new Error(res.status + " " + res.statusText);
    return res.json();
  }

  function badge(status) {
    return `<span class="badge ${status}">${status}</span>`;
  }

  // Small self-contained markdown → HTML renderer (no CDN dependency, on
  // purpose — this page stays a single file this microservice serves
  // itself). Covers what this parser's own output actually uses: headings,
  // bold/italic, inline code, links, simple lists, pipe tables, the
  // "<!-- Page N (mode) -->" markers it inserts between pages, and — the
  // main point — markdown image syntax rendered as an actual small
  // clickable thumbnail instead of a raw Cloudinary URL.
  function renderMarkdown(md) {
    if (!md) return "";
    let html = esc(md);

    // Images first (they contain "[...]" too, so must run before links).
    // Kept as one line — a multi-line template here would inject blank-line
    // gaps that corrupt the paragraph-splitting pass further down.
    html = html.replace(/!\[([^\]]*)\]\(([^)\s]+)\)/g, (_, alt, url) =>
      `<span class="md-fig"><img src="${url}" alt="${alt}" loading="lazy" onclick="openLightbox('${url}')">${alt ? `<span class="md-fig-caption">${alt}</span>` : ""}</span>`);
    html = html.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, (_, text, url) =>
      `<a href="${url}" target="_blank" rel="noopener">${text}</a>`);

    // Page-boundary comments this parser inserts between concatenated pages.
    html = html.replace(/&lt;!--\s*(.*?)\s*--&gt;/g, "<div class='md-comment'>$1</div>");

    // Pipe tables (a contiguous block of "| ... |" lines, 2nd line a separator).
    html = html.replace(/(^\|.*\|[ \t]*\n\|[ \t:|-]+\|[ \t]*\n(?:\|.*\|[ \t]*\n?)*)/gm, (block) => {
      const rows = block.trim().split("\n").map((r) => r.replace(/^\||\|$/g, "").split("|").map((c) => c.trim()));
      const [head, , ...body] = rows;
      const th = head.map((c) => `<th>${c}</th>`).join("");
      const tr = body.map((r) => `<tr>${r.map((c) => `<td>${c}</td>`).join("")}</tr>`).join("");
      return `<table><thead><tr>${th}</tr></thead><tbody>${tr}</tbody></table>`;
    });

    // Headings
    html = html.replace(/^###### (.*)$/gm, "<h4>$1</h4>");
    html = html.replace(/^##### (.*)$/gm, "<h4>$1</h4>");
    html = html.replace(/^#### (.*)$/gm, "<h4>$1</h4>");
    html = html.replace(/^### (.*)$/gm, "<h3>$1</h3>");
    html = html.replace(/^## (.*)$/gm, "<h2>$1</h2>");
    html = html.replace(/^# (.*)$/gm, "<h1>$1</h1>");

    // Bold / italic / inline code
    html = html.replace(/\*\*\*([^*]+)\*\*\*/g, "<strong><em>$1</em></strong>");
    html = html.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
    html = html.replace(/(^|[^*])\*([^*\n]+)\*/g, "$1<em>$2</em>");
    html = html.replace(/`([^`]+)`/g, "<code>$1</code>");

    // Simple unordered lists
    html = html.replace(/^(?:[-*] )(.*)$/gm, "<li>$1</li>");
    html = html.replace(/(<li>[\s\S]*?<\/li>\n?)+/g, (m) => `<ul>${m}</ul>`);

    // Paragraphs — wrap remaining plain-text blocks; leave already-tagged
    // blocks (headings/lists/tables/figures) alone.
    html = html.split(/\n{2,}/).map((block) => {
      const t = block.trim();
      if (!t) return "";
      if (/^<(h\d|ul|table|div|span)/.test(t)) return t;
      return `<p>${t.replace(/\n/g, "<br>")}</p>`;
    }).join("\n");

    return html;
  }

  // ─── List view ─────────────────────────────────────────────────────────

  function renderStats(s) {
    const cards = [
      ["Total runs", s.total_runs, ""],
      ["Success", s.success, "ok"],
      ["Empty result", s.empty, "warn"],
      ["Failed", s.failed, "bad"],
      ["Avg duration", fmtMs(s.avg_duration_ms), ""],
      ["Total pages", s.total_pages, ""],
      ["Total blocks", s.total_blocks, ""],
      ["Total figures", s.total_figures, ""],
    ];
    document.getElementById("stats").innerHTML = cards.map(([label, value, cls]) =>
      `<div class="stat ${cls}"><div class="label">${label}</div><div class="value">${value}</div></div>`
    ).join("");
  }

  function renderRuns(runs) {
    const body = document.getElementById("runs-body");
    const emptyState = document.getElementById("empty-state");
    if (!runs.length) {
      body.innerHTML = "";
      emptyState.style.display = "block";
      return;
    }
    emptyState.style.display = "none";
    body.innerHTML = runs.map((r) => `
      <tr data-id="${r.run_id}">
        <td class="fname" title="${esc(r.filename)}">${esc(r.filename)}</td>
        <td>${badge(r.status)}</td>
        <td class="muted">${esc(r.mode)}</td>
        <td>${r.pages ?? "—"}</td>
        <td>${r.blocks_count ?? "—"}</td>
        <td>${r.figures_count ?? "—"}</td>
        <td class="muted">${fmtMs(r.duration_ms)}</td>
        <td class="muted">${fmtTime(r.created_at)}</td>
      </tr>
    `).join("");
    [...body.querySelectorAll("tr")].forEach((tr) => {
      tr.addEventListener("click", () => { window.location.href = "/dashboard/" + tr.dataset.id; });
    });
  }

  document.getElementById("filters").addEventListener("click", (e) => {
    if (e.target.tagName !== "BUTTON") return;
    [...document.querySelectorAll("#filters button")].forEach((b) => b.classList.remove("active"));
    e.target.classList.add("active");
    currentStatus = e.target.dataset.status;
    refreshList();
  });

  async function refreshList() {
    try {
      const [stats, runsRes] = await Promise.all([
        api("/dashboard/api/stats"),
        api("/dashboard/api/runs?limit=100" + (currentStatus ? "&status=" + currentStatus : "")),
      ]);
      renderStats(stats);
      renderRuns(runsRes.runs);
      document.getElementById("last-updated").textContent = "Updated " + new Date().toLocaleTimeString();
    } catch (e) {
      document.getElementById("last-updated").textContent = "Error: " + e.message;
    }
  }

  // ─── Detail view (/dashboard/<run_id>) ────────────────────────────────

  function pageCard(p) {
    const img = p.image_url
      ? `<img src="${esc(p.image_url)}" loading="lazy" alt="Page ${p.page}" onclick="openLightbox('${esc(p.image_url)}')">`
      : `<div class="no-img">No page image captured</div>`;
    return `
      <div class="page-card">
        <div class="page-head">
          <span><b>Page ${p.page}</b> <span class="muted">· ${esc(p.mode || "")}</span></span>
          <span class="muted">${p.blocks_count ?? 0} blocks · ${p.figures_count ?? 0} figures</span>
        </div>
        <div class="page-body">
          <div class="page-img">${img}</div>
          <div class="page-md md-render">${p.markdown ? renderMarkdown(p.markdown) : "<span class='muted'>No text extracted for this page.</span>"}</div>
        </div>
      </div>
    `;
  }

  function openLightbox(url) {
    document.getElementById("lightbox-img").src = url;
    document.getElementById("lightbox").classList.add("open");
  }
  document.getElementById("lightbox").addEventListener("click", () => {
    document.getElementById("lightbox").classList.remove("open");
  });

  async function loadRunDetail(runId) {
    const el = document.getElementById("detail-view");
    document.getElementById("last-updated").textContent = "";
    el.innerHTML = "<div class='muted'>Loading…</div>";
    try {
      const r = await api(`/dashboard/api/runs/${runId}`);
      el.innerHTML = `
        <a class="back" href="/dashboard">&larr; All runs</a>
        <div class="detail-head">
          <h2>${esc(r.filename)}</h2>
          <div>${badge(r.status)} <span class="muted">${fmtTime(r.created_at)}</span></div>
        </div>
        <div class="meta-grid">
          <div><div class="k">Mode</div><div class="v">${esc(r.mode)}</div></div>
          <div><div class="k">Pages</div><div class="v">${r.pages ?? "—"}</div></div>
          <div><div class="k">Blocks</div><div class="v">${r.blocks_count ?? "—"}</div></div>
          <div><div class="k">Figures</div><div class="v">${r.figures_count ?? "—"}</div></div>
          <div><div class="k">Duration</div><div class="v">${fmtMs(r.duration_ms)}</div></div>
          <div><div class="k">Size</div><div class="v">${r.bytes ? (r.bytes/1024).toFixed(0) + " KB" : "—"}</div></div>
        </div>
        ${r.error ? `<div class="error-box">${esc(r.error)}</div>` : ""}

        <div class="section-label">Page-by-page compare — rendered page vs. what was extracted from it</div>
        <div id="page-compare" class="page-compare"><div class="loading-inline">Loading pages…</div></div>

        <div class="section-label">Full markdown output</div>
        ${r.markdown ? `<div class="md-render" style="background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:14px;margin-top:12px;max-height:60vh;overflow-y:auto">${renderMarkdown(r.markdown)}</div>` : `<div class="muted" style="margin-top:8px">No markdown captured for this run.</div>`}
      `;

      try {
        const pagesRes = await api(`/dashboard/api/runs/${runId}/pages`);
        const compareEl = document.getElementById("page-compare");
        if (!compareEl) return;
        compareEl.innerHTML = pagesRes.pages.length
          ? pagesRes.pages.map(pageCard).join("")
          : `<div class="muted">No per-page previews captured for this run (it may predate the page-compare feature).</div>`;
      } catch (e) {
        const compareEl = document.getElementById("page-compare");
        if (compareEl) compareEl.innerHTML = `<div class="error-box">Failed to load pages: ${esc(e.message)}</div>`;
      }
    } catch (e) {
      el.innerHTML = `<a class="back" href="/dashboard">&larr; All runs</a><div class="error-box">Failed to load run: ${esc(e.message)}</div>`;
    }
  }

  // ─── Router: /dashboard (list) vs /dashboard/<run_id> (detail) ────────

  function currentRunId() {
    const m = window.location.pathname.match(/^\/dashboard\/([^\/]+)\/?$/);
    return m ? decodeURIComponent(m[1]) : null;
  }

  const runId = currentRunId();
  if (runId) {
    document.getElementById("list-view").style.display = "none";
    document.getElementById("detail-view").style.display = "block";
    loadRunDetail(runId);
  } else {
    document.getElementById("list-view").style.display = "block";
    document.getElementById("detail-view").style.display = "none";
    refreshList();
    setInterval(refreshList, 15000);
  }
</script>
