server {
    listen 80;
    server_name 54.197.111.73;

    client_max_body_size 25m;

    # WebSocket routes (voice mode, dictation) need the Upgrade/Connection
    # headers forwarded explicitly -- nginx does not pass these through by
    # default, so without this block every /voice/* WS handshake falls
    # through to a plain HTTP request and the app's WebSocket-only routes
    # 404 (confirmed live: this was missed because all voice testing during
    # development went through an SSH tunnel straight to the container,
    # bypassing nginx entirely). A long read/send timeout matches a voice
    # session's lifetime, not nginx's 60s HTTP default.
    location /voice/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE streaming (/chat/stream) needs unbuffered proxying, or nginx
        # holds the whole response before sending it to the client and the
        # UI never sees incremental chunks. Long agent turns (multi-minute
        # tool-call loops) also need a generous read timeout, not nginx's
        # 60s default, or nginx cuts the connection mid-turn.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
