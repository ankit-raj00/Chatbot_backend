server {
    listen 80;
    server_name 54.197.111.73;

    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE streaming (/chat/stream) needs unbuffered proxying, or nginx
        # holds the whole response before sending it to the client and the
        # UI never sees incremental chunks. Long agent turns (multi-minute
        # tool-call loops) also need a generous read timeout, not nginx's
        # 60s default, or nginx cuts the connection mid-turn.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
