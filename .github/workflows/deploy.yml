name: Deploy backend

# Runs after "Backend tests" finishes successfully on main, or manually via
# workflow_dispatch. Mirrors the manual process this project used before CI/CD
# existed: rsync the repo to a fresh versioned directory on the EC2 box, copy
# the (gitignored) .env forward from the previous deploy, docker build, then
# swap the running container — keeping the old one around, renamed, so a
# failed health check can roll straight back to it.
on:
  workflow_run:
    workflows: ["Backend tests"]
    types: [completed]
  workflow_dispatch:

jobs:
  deploy:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up deploy key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy
        id: deploy
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          SARVAM_API_KEY: ${{ secrets.SARVAM_API_KEY }}
          DEEPGRAM_API_KEY: ${{ secrets.DEEPGRAM_API_KEY }}
          CARTESIA_API_KEY: ${{ secrets.CARTESIA_API_KEY }}
          VOICE_STT_PROVIDER: ${{ vars.VOICE_STT_PROVIDER }}
          VOICE_TTS_PROVIDER: ${{ vars.VOICE_TTS_PROVIDER }}
        run: |
          set -e
          SSH_OPTS="-i ~/.ssh/deploy_key -o StrictHostKeyChecking=no"
          VERSION="ci-${{ github.run_number }}"
          REMOTE_DIR="chatbot-backend-$VERSION"
          PREV_BACKUP="chatbot-backend-prev-$(date +%s)"
          echo "prev_backup=$PREV_BACKUP" >> "$GITHUB_OUTPUT"

          ssh $SSH_OPTS "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p ~/$REMOTE_DIR"

          # .env is gitignored (never in the checkout) and deliberately excluded
          # here too, so --delete can't touch the destination's real .env before
          # we've had a chance to copy the previous one forward below.
          rsync -az --delete \
            --exclude='.git' --exclude='.github' --exclude='venv' \
            --exclude='__pycache__' --exclude='.env' \
            -e "ssh $SSH_OPTS" \
            ./ "$DEPLOY_USER@$DEPLOY_HOST:~/$REMOTE_DIR/"

          # App secrets/vars that are managed in GitHub (not carried forward
          # from the box's own .env) get layered on after the copy-forward
          # below, via deploy/merge_env.sh. Add new KEY=VALUE lines here as
          # more such secrets are introduced, rather than hand-editing the box.
          VALUES_FILE="$(mktemp)"
          {
            echo "SARVAM_API_KEY=$SARVAM_API_KEY"
            echo "DEEPGRAM_API_KEY=$DEEPGRAM_API_KEY"
            echo "CARTESIA_API_KEY=$CARTESIA_API_KEY"
            echo "VOICE_STT_PROVIDER=$VOICE_STT_PROVIDER"
            echo "VOICE_TTS_PROVIDER=$VOICE_TTS_PROVIDER"
          } > "$VALUES_FILE"
          scp $SSH_OPTS "$VALUES_FILE" "$DEPLOY_USER@$DEPLOY_HOST:~/$REMOTE_DIR/voice.env.new"
          rm -f "$VALUES_FILE"

          ssh $SSH_OPTS "$DEPLOY_USER@$DEPLOY_HOST" "
            set -e
            LATEST_ENV=\$(ls -dt ~/chatbot-backend-v* ~/chatbot-backend-ci-* 2>/dev/null | grep -v '$REMOTE_DIR\$' | head -1)/.env
            cp \"\$LATEST_ENV\" ~/$REMOTE_DIR/.env

            bash ~/$REMOTE_DIR/deploy/merge_env.sh ~/$REMOTE_DIR/.env ~/$REMOTE_DIR/voice.env.new
            rm -f ~/$REMOTE_DIR/voice.env.new

            # Reclaim disk BEFORE building. Every deploy adds a ~1.3GB image
            # plus build cache and nothing removed any of it, so this 8GB box
            # crept to 88% full and a deploy died partway through pip install
            # with ENOSPC (run 32260412602) — the build needs several GB of
            # scratch space. Keep the live container and the single most recent
            # rollback target, drop everything older. 'docker image prune -a'
            # cannot remove an image backing a running OR a stopped container,
            # so both of those survive by construction rather than by luck.
            docker ps -a --filter 'name=chatbot-backend-prev-' --format '{{.Names}}' \
              | sort -r | tail -n +2 | xargs -r docker rm || true
            docker image prune -a -f || true
            docker builder prune -a -f || true
            # One source tree per deploy accumulates too (~7MB each). The
            # directory for THIS deploy already exists (rsync ran above) and
            # sorts newest, so keeping the newest 3 never removes it.
            ls -dt ~/chatbot-backend-* 2>/dev/null | tail -n +4 | xargs -r rm -rf || true
            df -h / | tail -1

            cd ~/$REMOTE_DIR
            docker build -t chatbot-backend:$VERSION .

            docker stop chatbot-backend
            docker rename chatbot-backend $PREV_BACKUP

            docker run -d --name chatbot-backend --restart unless-stopped \
              -p 8000:8000 \
              --env-file ~/$REMOTE_DIR/.env \
              -v /home/ec2-user/agentx_workspace:/data/agentx_workspace \
              chatbot-backend:$VERSION
          "

      - name: Health check (rolls back on failure)
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ok=""
          for i in $(seq 1 10); do
            if curl -sf https://agentx-api.ankitrajai.in/docs > /dev/null; then ok=1; break; fi
            sleep 3
          done

          if [ -z "$ok" ]; then
            echo "Health check failed — rolling back to ${{ steps.deploy.outputs.prev_backup }}"
            ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no "$DEPLOY_USER@$DEPLOY_HOST" "
              docker stop chatbot-backend 2>/dev/null || true
              docker rm chatbot-backend 2>/dev/null || true
              docker rename ${{ steps.deploy.outputs.prev_backup }} chatbot-backend
              docker start chatbot-backend
            "
            exit 1
          fi
          echo "Healthy"
